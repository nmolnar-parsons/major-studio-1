<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 - Major Studio 1</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- UI Library CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="styles.css">
    
    
</head>
<body>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/xcash/bootstrap-autocomplete@v2.3.7/dist/latest/bootstrap-autocomplete.min.js"></script>

    <script src="main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', e => {
            $('#input-datalist').autocomplete()
        }, false);
    </script>
    <h1 id="title">Founding Fatherdle</h1>
    <div id="game_area">
        <div id="face-image"></div>
        <div id="guess">

            <div id="input-boxes"></div>
            <div id="legend">
                <div class="legend-cat">Name</div>
                <div class="legend-cat">Occupation</div>
                <div class="legend-cat">First Initial</div>
                <div class="legend-cat">Last Initial</div>
                <div class="legend-cat"># Portraits</div>
            </div>
            <div id="guess_result"></div>
            <text id="reset">give up?</text>
        </div>
    </div>
    <div id="sitter-popup" class="hidden">
        <div id="sitter-popup-content">
            <p id="sitter-name"></p>
            <button id="close-popup">try again?</button>
        </div>
    </div>
</body>
