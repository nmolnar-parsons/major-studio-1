<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
           /* Fill in style as needed here */ 
           .thumbnail-img {
                width: 100px;
                height: 100px;
                object-fit: cover; /* crops to fill the box */
            }
            #thumbnail_gallery_container {
              overflow-x: auto;
              overflow-y: hidden;
              white-space: nowrap;
              width: 100%;
              height: 200px;
            }
            
            #thumbnail_gallery {
              display: block;
            }

            #tooltip {
                position: absolute;
                opacity: 0;
                pointer-events: none;
                background: #fff;
                border: 1px solid #ccc;
                padding: 8px;
                border-radius: 4px;
                z-index: 1000;

            }

        </style>
    </head>
    <body>
        <div id="tooltip"></div>
        <script src="main_proto_thumbnails.js"></script>
        <svg id="viz"></svg>
        <div id="thumbnail_gallery_container">
            <svg id="thumbnail_gallery"></svg>
        </div>
    </body>
</html>
